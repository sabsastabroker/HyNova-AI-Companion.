
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HyNova APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK was not found on the runner."
            exit 1
          fi

      - name: Find Gradle project
        id: locate
        shell: bash
        run: |
          PROJECT_DIR=""

          while IFS= read -r file; do
            dir="${file%/*}"
            [ "$dir" = "$file" ] && dir="."

            if [ -f "$dir/gradlew" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(
            find . -maxdepth 6 -type f -name gradlew \
              -not -path '*/.git/*'
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::gradlew not found. Check that Android project files are committed."
            find . -maxdepth 4 -type f \
              \( -name 'settings.gradle' \
              -o -name 'settings.gradle.kts' \
              -o -name 'build.gradle' \
              -o -name 'build.gradle.kts' \) -print
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found at $PROJECT_DIR"

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HyNova-Android-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 7
          
