
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "main"

permissions:
  contents: read

jobs:
  build:
    name: Build HyNova APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1
          submodules: recursive

      - name: Show repository files
        run: |
          echo "Repository root:"
          pwd
          echo "Files:"
          ls -la
          echo "Gradle project files:"
          find . -maxdepth 5 \
            \( -name settings.gradle -o \
               -name settings.gradle.kts -o \
               -name gradlew \) \
            -print

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Android project
        id: locate
        shell: bash
        run: |
          PROJECT_DIR=""

          while IFS= read -r file; do
            dir="${file%/*}"
            [ "$dir" = "$file" ] && dir="."

            if [ -f "$dir/gradlew" ] && \
               { [ -f "$dir/settings.gradle" ] || \
                 [ -f "$dir/settings.gradle.kts" ]; }; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(
            find . -maxdepth 5 \
              \( -name settings.gradle -o \
                 -name settings.gradle.kts \) \
              -type f
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android Gradle project not found. Check repository files."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project at: $PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HyNova-Android-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
